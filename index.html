<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Premium safety institute</title>

  <style>

    /* =====================================================
       GLOBAL
       ===================================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }


    /* =====================================================
       LOADING SCREEN
       ===================================================== */

    #loadingScreen {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-direction: column;

      background:
        radial-gradient(
          circle at center,
          #ffffff 0%,
          #f7faff 55%,
          #eef4ff 100%
        );

      color: #1f2937;

      z-index: 10000;

      opacity: 1;

      visibility: visible;

      transition:
        opacity 0.5s ease,
        visibility 0.5s ease;
    }


    /* =====================================================
       LOADING HIDE ANIMATION
       ===================================================== */

    #loadingScreen.hide {

      opacity: 0;

      visibility: hidden;

      pointer-events: none;
    }


    /* =====================================================
       CIRCLE WRAPPER
       ===================================================== */

    .loader-wrapper {

      position: relative;

      width: 110px;
      height: 110px;

      display: flex;

      align-items: center;
      justify-content: center;

      margin-bottom: 22px;
    }


    /* =====================================================
       OUTER GLOW
       ===================================================== */

    .loader-wrapper::before {

      content: "";

      position: absolute;

      width: 110px;
      height: 110px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(37, 99, 235, 0.10),
          transparent 70%
        );

      animation:
        pulseGlow 2s ease-in-out infinite;
    }


    /* =====================================================
       CIRCLE
       ===================================================== */

    .loader {

      position: relative;

      width: 82px;
      height: 82px;

      border-radius: 50%;

      background: #ffffff;

      box-shadow:
        0 8px 30px rgba(37, 99, 235, 0.12);

      display: flex;

      align-items: center;
      justify-content: center;
    }


    /* =====================================================
       ANIMATED PROGRESS RING
       ===================================================== */

    .loader::before {

      content: "";

      position: absolute;

      inset: 0;

      border-radius: 50%;

      background:

        conic-gradient(
          #2563eb 0deg,
          #06b6d4 90deg,
          #22c55e 180deg,
          #2563eb 270deg,
          #2563eb 360deg
        );

      -webkit-mask:
        radial-gradient(
          farthest-side,
          transparent calc(100% - 7px),
          #000 calc(100% - 6px)
        );

      mask:
        radial-gradient(
          farthest-side,
          transparent calc(100% - 7px),
          #000 calc(100% - 6px)
        );

      animation:
        rotateLoader 1.2s linear infinite;
    }


    /* =====================================================
       INNER CIRCLE
       ===================================================== */

    .loader::after {

      content: "";

      position: absolute;

      width: 62px;
      height: 62px;

      border-radius: 50%;

      background: #ffffff;

      box-shadow:
        inset 0 0 12px rgba(0, 0, 0, 0.03);
    }


    /* =====================================================
       CENTER DOT
       ===================================================== */

    .loader-center {

      position: relative;

      z-index: 2;

      width: 13px;
      height: 13px;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #2563eb,
          #06b6d4
        );

      box-shadow:
        0 0 0 5px rgba(37, 99, 235, 0.08),
        0 0 18px rgba(37, 99, 235, 0.35);

      animation:
        centerPulse 1.3s ease-in-out infinite;
    }


    /* =====================================================
       LOADING TEXT
       ===================================================== */

    .loading-title {

      font-size: 18px;

      font-weight: 700;

      letter-spacing: 0.3px;

      color: #1f2937;

      margin-bottom: 7px;
    }


    /* =====================================================
       SUB TEXT
       ===================================================== */

    .loading-subtitle {

      font-size: 13px;

      font-weight: 400;

      color: #6b7280;

      letter-spacing: 0.2px;

      animation:
        textFade 1.8s ease-in-out infinite;
    }


    /* =====================================================
       DOT ANIMATION
       ===================================================== */

    .loading-dots::after {

      content: "";

      animation:
        dots 1.5s steps(4, end) infinite;
    }


    /* =====================================================
       IFRAME
       ===================================================== */

    .iframe-container {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      border: none;

      z-index: 9999;

      background: #ffffff;
    }


    /* =====================================================
       ANIMATIONS
       ===================================================== */

    @keyframes rotateLoader {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }


    @keyframes pulseGlow {

      0%,
      100% {
        transform: scale(0.95);
        opacity: 0.55;
      }

      50% {
        transform: scale(1.08);
        opacity: 1;
      }
    }


    @keyframes centerPulse {

      0%,
      100% {
        transform: scale(0.85);
      }

      50% {
        transform: scale(1.15);
      }
    }


    @keyframes textFade {

      0%,
      100% {
        opacity: 0.55;
      }

      50% {
        opacity: 1;
      }
    }


    @keyframes dots {

      0% {
        content: "";
      }

      25% {
        content: ".";
      }

      50% {
        content: "..";
      }

      75%,
      100% {
        content: "...";
      }
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 480px) {

      .loader-wrapper {

        width: 100px;
        height: 100px;

        margin-bottom: 20px;
      }

      .loader-wrapper::before {

        width: 100px;
        height: 100px;
      }

      .loader {

        width: 76px;
        height: 76px;
      }

      .loader::after {

        width: 57px;
        height: 57px;
      }

      .loading-title {

        font-size: 17px;
      }

      .loading-subtitle {

        font-size: 12px;
      }
    }

  </style>
</head>


<body>


  <!-- =====================================================
       LOADING SCREEN
       ===================================================== -->

  <div id="loadingScreen">

    <div class="loader-wrapper">

      <div class="loader">

        <div class="loader-center"></div>

      </div>

    </div>


    <div class="loading-title">
      Loading
    </div>


    <div class="loading-subtitle">
      Please wait<span class="loading-dots"></span>
    </div>

  </div>



  <script>

    /* =====================================================
       URL PARAMETERS
       ===================================================== */

    const params =
      new URLSearchParams(
        window.location.search
      );


    /* =====================================================
       GOOGLE APPS SCRIPT URL
       ===================================================== */

    let iframeUrl =
      "https://script.google.com/macros/s/AKfycbwxsuHzv1fbgqPliQeqb84BfoRqR64yrU9XL6SM4kwxGRzNbBM5c5ilXRvci7H_mEbJ7g/exec";


    /* =====================================================
       ID PARAMETER
       ===================================================== */

    if (params.has("id")) {

      iframeUrl +=
        "?id=" +
        encodeURIComponent(
          params.get("id")
        );

    }


    /* =====================================================
       CREATE IFRAME
       ===================================================== */

    const iframe =
      document.createElement("iframe");


    iframe.className =
      "iframe-container";


    iframe.src =
      iframeUrl;


    iframe.allowFullscreen =
      true;


    /* =====================================================
       WHEN IFRAME LOADS
       ===================================================== */

    iframe.addEventListener(
      "load",
      function () {

        const loading =
          document.getElementById(
            "loadingScreen"
          );


        if (loading) {

          /*
           * Smooth fade-out
           */

          loading.classList.add(
            "hide"
          );


          /*
           * Completely remove
           * loading screen after animation
           */

          setTimeout(
            function () {

              if (loading) {

                loading.remove();

              }

            },
            550
          );

        }

      }
    );


    /* =====================================================
       ADD IFRAME TO PAGE
       ===================================================== */

    document.body.appendChild(
      iframe
    );

  </script>

</body>
</html>
